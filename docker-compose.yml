services:
  getway:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
  
  frontend:
    image: sagar116/erp-frontend:latest
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
  
  backend:
    image: sagar116/erp-backend:latest
    env_file:
      - .env

networks:
  erp-network:
    driver: bridge
    