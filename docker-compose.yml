services:
  db:
    image: postgres:16-alpine
    container_name: backend_db
    environment:
      POSTGRES_DB: ${DB_NAME:-backend_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  db_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: db_backup_worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily        # Runs every midnight
      - BACKUP_KEEP_DAYS=7     # Deletes local files older than 7 days
      - BACKUP_SUFFIX=.sql
    volumes:
      - ./backups:/backups     # Maps to the host folder
    depends_on:
      - db
    networks:
      - erp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: backend_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    networks:
      - erp-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
  redis:
    image: redis:7-alpine
    container_name: backend_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always
    networks:
      - erp-network

  getway:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erp-network

  # No Restart, Only run one time for ssl creation 
  certbot:
    image: certbot/certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - erp-network
  
  frontend:
    image: sagar116/erp-frontend:latest
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - erp-network
  
  backend:
    image: sagar116/erp-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  erp-network:
    driver: bridge
    
