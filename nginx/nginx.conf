# ---------------- UPSTREAMS ----------------
upstream frontend_app {
  server frontend:80;
}

upstream backend_api {
  server backend:8000;
}

# ---------------- HTTP (Certbot + Redirect) ----------------
server {
  listen 80;
  server_name erp.constructiveindia.com;

  # Required for Certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------- HTTPS (MAIN SERVER) ----------------
server {
  listen 443 ssl;
  server_name erp.constructiveindia.com;

  ssl_certificate /etc/letsencrypt/live/erp.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.yourdomain.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # ---------- Performance ----------
  client_max_body_size 50M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # ---------- Security Headers ----------
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # ---------- Frontend ----------
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ---------- Backend API ----------
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ---------- Block sensitive ----------
  location ~ ^/(admin|swagger|redoc) {
    return 404;
  }
}