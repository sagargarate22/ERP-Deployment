name: "Provision Contabo Infra"

on:
  workflow_dispatch: # Manual trigger

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    
    env:
      # Contabo API Secrets (Different from AWS)
      TF_VAR_contabo_client_id: ${{ secrets.CONTABO_CLIENT_ID }}
      TF_VAR_contabo_client_secret: ${{ secrets.CONTABO_CLIENT_SECRET }}
      TF_VAR_contabo_api_user: ${{ secrets.CONTABO_API_USER }}
      TF_VAR_contabo_api_password: ${{ secrets.CONTABO_API_PASS }}
      
      # Shared Secrets
      TF_VAR_godaddy_api_key: ${{ secrets.GODADDY_API_KEY }}
      TF_VAR_godaddy_api_secret: ${{ secrets.GODADDY_API_SECRET }}
      TF_VAR_public_ssh_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      TF_VAR_gh_pat: ${{ secrets.GH_PAT }}
      
      # Application Specifics
      TF_VAR_repo_path: ${{ secrets.REPO_PATH }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      
      TF_VAR_s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      TF_VAR_s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
      TF_VAR_s3_endpoint: ${{secrets.S3_ENDPOINT}} # Singapore Endpoint

      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}

      TF_VAR_env_file_content: ${{ secrets.ENV_FILE_CONTENT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: infra/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/prod
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/prod
        run: terraform apply -auto-approve tfplan
