name: Deploy ERP Prod

on:
  workflow_dispatch:

concurrency:
  group: erp-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd /opt/erp
            
            # 2. Update Environment variables
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            # 3. Pull new images and restart (Zero-Downtime)
            # Using 'up -d' without 'down' keeps the site running while switching
            docker compose pull
            docker compose down
            docker compose up -d --remove-orphans
            
            # 4. Clean up old unused Docker images to save space
            docker image prune -f
          EOF
