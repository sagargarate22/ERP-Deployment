name: "Provision AWS Infra"

on:
  workflow_dispatch: # Manual trigger for safety

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    
    # Map GitHub Secrets to Terraform Variables
    env:
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: "us-east-1" # Change to your preferred region
      TF_VAR_godaddy_api_key: ${{ secrets.GODADDY_API_KEY }}
      TF_VAR_godaddy_api_secret: ${{ secrets.GODADDY_API_SECRET }}
      TF_VAR_public_ssh_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      TF_VAR_gh_pat: ${{ secrets.GH_PAT }}
      TF_VAR_repo_path: "your-org/your-repo-name"
      TF_VAR_domain_name: "yourcompany.com"
      TF_VAR_s3_bucket_name: "erp-prod-backup-bucket"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
